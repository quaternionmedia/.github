name: 👖 Lint

on:
  workflow_call:
    inputs:
      python_version:
        description: The version of python to setup
        default: 3.x
        type: string

      ruff_args:
        description: The arguments to pass to ruff
        default: -v
        type: string

      ruff_version:
        description: >-
          A pip version specifier for ruff, such as '>=0.5,<1', so the check
          runs the ruff the caller lints with; empty installs the newest
        default: ''
        type: string

jobs:
  lint:
    name: 👔 Linter
    runs-on: ubuntu-latest

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: 🐕 Install ruff
        env:
          SPECIFIER: ${{ inputs.ruff_version }}
        run: pip install "ruff${SPECIFIER}"

      - name: 🐶 Run Ruff Linter
        run: ruff check ${{ inputs.ruff_args }} .
