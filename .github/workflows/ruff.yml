name: 🐶 Ruff linter
on:
  workflow_call:
    inputs:
      args:
        description: Arguments to pass to ruff
        type: string
        default: '.'
      python_version:
        description: The version of python to setup
        type: string
        default: 3.x
      ruff_version:
        description: >-
          A pip version specifier for ruff, such as '>=0.5,<1', so the check
          runs the ruff the caller lints with; empty installs the newest
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: 🚧 Install dependencies
        env:
          SPECIFIER: ${{ inputs.ruff_version }}
        run: pip install "ruff${SPECIFIER}"

      - name: 🐕 Run Ruff
        run: ruff check ${{ inputs.args }}
