name: 🖤 Black

on:
  workflow_call:
    inputs:
      python_version:
        description: The version of python to setup
        default: 3.11
        type: string

      black_version:
        description: >-
          A pip version specifier for black, such as '>=26,<27', so the check
          runs the black the caller formats with; empty installs the newest
        default: ''
        type: string

jobs:
  black:
    name: ⬛ Black Formatter
    runs-on: ubuntu-latest

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: 🏴 Install black
        env:
          SPECIFIER: ${{ inputs.black_version }}
        run: pip install "black${SPECIFIER}"

      - name: 🎱 Run Black
        run: black -vS --check --diff --color .
