name: 🐍 Pytest

on:
  workflow_call:
    inputs:
      python_version:
        description: The version of python to setup
        type: string
        default: 3.x

      environment:
        description: The name of the environment to deploy
        type: string
        default: codecov

      pip_args:
        description: Install args for pip
        type: string
        default: .[test]

      pytest_args:
        description: Additional args to pass to pytest
        type: string

      submodules:
        description: Git submodule settings, passed to actions/checkout
        type: string
        default: ''

      requirements:
        description: >-
          A pinned requirements file, installed in its own pip call before
          pip_args, the way a Dockerfile installs a lockfile
        type: string
        default: ''

jobs:
  run_pytest:
    name: 🐍 Run pytest and upload coverage report
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: 📌 Install pinned requirements
        if: inputs.requirements != ''
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: pip install -r "$REQUIREMENTS"

      - name: 🏗️ Install dependencies
        run: pip install ${{ inputs.pip_args }}

      - name: 🧪 Run pytest suite
        run: pytest --cov --cov-report lcov ${{ inputs.pytest_args }}

      - name: 📈 Uploade coverage report
        # run this step, even if the tests fail
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
